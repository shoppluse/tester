<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hare Krishna Nature Farm | Live Satellite Portal</title>
  
  <!-- Leaflet Map Engine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ==========================================================================
       1. CORE TEMPLATE LAYOUT & THEME
       ========================================================================== */
    :root {
      --bg-dark: #050a08;
      --accent-gold: #ffd700;
      --accent-glow: rgba(255, 215, 0, 0.45);
      --text-main: #ffffff;
      --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      display: flex; 
      flex-direction: column; 
    }

    /* --- CINEMATIC CLOUD UNCOVERING INTRO SCREEN --- */
    #cloud-intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.95) 0%, rgba(200, 215, 225, 0.9) 40%, rgba(10, 25, 20, 0.98) 100%);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1), transform 2.2s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: all;
    }

    .intro-content {
      animation: floatUp 2.5s ease-out forwards;
    }

    .intro-title {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 215, 0, 0.8);
      line-height: 1.3;
    }

    .intro-subtitle {
      font-size: 1.1rem;
      color: #0d2218;
      font-weight: 700;
      letter-spacing: 6px;
      margin-top: 10px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(25px) scale(0.95); }
      30% { opacity: 1; transform: translateY(0px) scale(1); }
      80% { opacity: 1; transform: translateY(0px) scale(1); }
      100% { opacity: 0; transform: translateY(-20px) scale(1.05); }
    }

    /* --- TOP HEADER BANNER --- */
    #template-header {
      width: 100%; 
      height: 75px;
      background: linear-gradient(180deg, #11221b 0%, #08120e 100%);
      border-bottom: 2px solid var(--accent-gold);
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.8);
      z-index: 1000; 
      flex-shrink: 0;
    }

    .template-title {
      font-size: 1.8rem; 
      font-weight: 800; 
      letter-spacing: 6px; 
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .template-subtitle {
      font-size: 0.75rem;
      color: var(--accent-gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 600;
    }

    /* --- RECTANGULAR MAP SECTION --- */
    #map-section {
      width: 100%; 
      flex-grow: 1; 
      position: relative; 
      background: #000;
      padding: 12px;
    }

    /* The Map Container Box */
    .map-container {
      width: 100%; 
      height: 100%; 
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 215, 0, 0.3);
      background: #08120e;
    }

    #real-satellite-map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* --- FLOATING HUD OVERLAY --- */
    .hud-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 16, 12, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .hud-text {
      font-size: 0.85rem;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .hud-text strong {
      color: var(--accent-gold);
    }

    /* Customizing Leaflet UI & Clean Popups */
    .leaflet-control-zoom a {
      background-color: rgba(6, 16, 12, 0.9) !important;
      color: var(--accent-gold) !important;
      border-color: rgba(255, 215, 0, 0.3) !important;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(8, 18, 14, 0.95) !important;
      color: #fff !important;
      border: 1px solid var(--accent-gold);
      border-radius: 8px !important;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8) !important;
    }

    .leaflet-popup-tip {
      background: rgba(8, 18, 14, 0.95) !important;
    }
  </style>
</head>
<body>

  <!-- CINEMATIC CLOUD UNCOVERING INTRO SCREEN -->
  <div id="cloud-intro">
    <div class="intro-content">
      <div class="intro-subtitle">Welcome To</div>
      <h1 class="intro-title">Hare Krishna<br>Nature Farm</h1>
    </div>
  </div>

  <!-- TOP TEMPLATE HEADER -->
  <header id="template-header">
    <div class="template-title">Hare Krishna Nature Farm</div>
    <div class="template-subtitle">Live Satellite Portal • Locked Sanctuary Perimeter</div>
  </header>

  <!-- MAIN RECTANGULAR MAP VIEWPORT -->
  <main id="map-section">
    <div class="map-container">
      
      <!-- Real Google Satellite Map Canvas -->
      <div id="real-satellite-map"></div>

      <!-- Floating Information Tag -->
      <div class="hud-overlay">
        <span class="hud-text">✨ <strong>Sanctuary Map:</strong> Click Any Location Marker to Smoothly Zoom In</span>
      </div>

    </div>
  </main>

  <!-- Leaflet Map Engine JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==========================================================================
    // 1. SANCTUARY LOCATIONS LIST
    // ==========================================================================
    const sanctuaryLocations = [
      { 
        name: "Krishna Balaram Temple", 
        lat: 12.398800, 
        lon: 76.757700, 
        description: "Sanctuary Center & Temple Complex",
        isCenter: true 
      },
      { 
        name: "Akshaya Patra Foundation", 
        lat: 12.396878, 
        lon: 76.760297, 
        description: "Community Kitchen & Service Initiative",
        isCenter: false 
      },
      { 
        name: "Kaveri River", 
        lat: 12.402789, 
        lon: 76.758100, 
        description: "Sacred Waters & Riverside Sanctuary",
        isCenter: false 
      },
      { 
        name: "Goshala", 
        lat: 12.397269, 
        lon: 76.757431, 
        description: "Cow Protection & Dairy Sanctuary",
        isCenter: false 
      }
    ];

    // ==========================================================================
    // 2. YOUR EXACT 29-POINT PROPERTY BOUNDARY
    // ==========================================================================
    const farmBoundaryCoordinates = [
      [12.402578, 76.752256], [12.401856, 76.751600], [12.401294, 76.751453],
      [12.401236, 76.752019], [12.400550, 76.752319], [12.400881, 76.753078],
      [12.399453, 76.753817], [12.399375, 76.754164], [12.396069, 76.756006],
      [12.395019, 76.756042], [12.394922, 76.757878], [12.394508, 76.758061],
      [12.394672, 76.758903], [12.395489, 76.758942], [12.395856, 76.760583],
      [12.398022, 76.760436], [12.398219, 76.760208], [12.398961, 76.760814],
      [12.399917, 76.760825], [12.400269, 76.760572], [12.400672, 76.760844],
      [12.401369, 76.760403], [12.401853, 76.760408], [12.401436, 76.761311],
      [12.401561, 76.761572], [12.401175, 76.763236], [12.402489, 76.763308],
      [12.402636, 76.763100], [12.402767, 76.763075]
    ];

    // ==========================================================================
    // 3. MAP ACCESS LOCK (RESTRICTING VIEWPORT)
    // ==========================================================================
    const southWestCorner = L.latLng(12.390428, 76.749592);
    const northEastCorner = L.latLng(12.408306, 76.766311);
    const restrictedBounds = L.latLngBounds(southWestCorner, northEastCorner);

    const centerLat = sanctuaryLocations[0].lat;
    const centerLon = sanctuaryLocations[0].lon;

    // Initialize map slightly zoomed out for the intro drop effect
    const map = L.map('real-satellite-map', {
      center: [centerLat, centerLon],
      zoom: 13,                         // Starts higher up in the clouds
      minZoom: 14,
      maxZoom: 20,
      maxBounds: restrictedBounds,
      maxBoundsViscosity: 1.0,
      zoomControl: true,
      attributionControl: false
    });

    // Load Real Google Maps Satellite Imagery Direct Tile Servers
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    // ==========================================================================
    // 4. DRAW THE THIN, ELEGANT GOLDEN BOUNDARY
    // ==========================================================================
    
    // A. Thinner, Softer Golden Outer Glow (Reduced weight to 4px)
    L.polygon(farmBoundaryCoordinates, {
      color: '#ffd700',       
      weight: 4,              
      opacity: 0.25,          
      fill: false             
    }).addTo(map);

    // B. Crisp, Thin Golden Property Line (Reduced weight to 1.8px)
    const propertyBoundary = L.polygon(farmBoundaryCoordinates, {
      color: '#ffd700',       
      weight: 1.8,            
      opacity: 0.9,           
      fillColor: '#ffd700',   
      fillOpacity: 0.08       
    }).addTo(map);

    // ==========================================================================
    // 5. PLACE THIN MARKERS & ADD "CLICK TO ZOOM" NAVIGATION
    // ==========================================================================
    sanctuaryLocations.forEach(spot => {
      // Made marker dots much thinner and smaller!
      const markerColor = spot.isCenter ? "#ffd700" : "#ffffff";
      const markerRadius = spot.isCenter ? 5.5 : 4.0;

      const marker = L.circleMarker([spot.lat, spot.lon], {
        radius: markerRadius,
        fillColor: markerColor,
        color: "#ffd700",     
        weight: 1.2,          // Super thin trim around the dot
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      // Clean Popup without raw coordinates!
      const popupContent = `
        <div style="text-align: center; padding: 4px; font-family: sans-serif;">
          <strong style="color: #ffd700; font-size: 14px; letter-spacing: 0.5px;">${spot.name}</strong><br>
          <span style="color: #ddd; font-size: 11px; display: block; margin: 4px 0;">${spot.description}</span>
          <span style="color: #88ff88; font-size: 10px; font-weight: bold; text-transform: uppercase;">↗ Click to Zoom Here</span>
        </div>
      `;
      
      marker.bindPopup(popupContent);

      // CLICK TO ZOOM EFFECT: Clicking any marker smoothly flies camera down to ground level!
      marker.on('click', () => {
        map.flyTo([spot.lat, spot.lon], 18, {
          animate: true,
          duration: 1.6,
          easeLinearity: 0.25
        });
      });
    });

    // ==========================================================================
    // 6. EXECUTE THE CLOUD UNCOVERING & DRONE DESCENT ANIMATION
    // ==========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const cloudIntro = document.getElementById('cloud-intro');
        
        // 1. Dissolve and part the cloud screen
        cloudIntro.style.opacity = '0';
        cloudIntro.style.transform = 'scale(1.1)';
        cloudIntro.style.pointerEvents = 'none';

        // 2. Fly camera down out of the clouds to fit the golden boundary
        map.flyToBounds(propertyBoundary.getBounds(), {
          padding: [30, 30],
          duration: 2.2,
          easeLinearity: 0.2
        });

        // Remove intro DOM element after fade finishes
        setTimeout(() => cloudIntro.remove(), 2200);
      }, 2300); // 2.3 seconds display time for the welcome text
    });
  </script>

</body>
</html>
