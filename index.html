<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hare Krishna Nature Farm | Live Satellite Portal</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070d09;
      --accent-gold: #d9b23c;
      --accent-gold-bright: #f3dd8f;
      --accent-glow: rgba(217, 178, 60, 0.35);
      --text-main: #f4eee0;
      --font-display: 'Cormorant Garamond', serif;
      --font-main: 'Inter', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }

    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: var(--bg-dark); color: var(--text-main);
      display: flex; flex-direction: column;
    }

    /* --- INTRO --- */
    #cloud-intro {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(244,238,224,0.97) 0%, rgba(203,216,205,0.92) 40%, rgba(10,20,15,0.98) 100%);
      z-index: 99999;
      display: flex; justify-content: center; align-items: center; text-align: center;
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), transform 2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .intro-content { animation: floatUp 2.4s ease-out forwards; }
    .intro-title {
      font-family: var(--font-display); font-weight: 700; font-size: 2.9rem; color: #12261a;
      letter-spacing: 1px; line-height: 1.25;
    }
    .intro-subtitle {
      font-size: 0.72rem; color: #1c3325; font-weight: 600; letter-spacing: 5px;
      margin-bottom: 10px; text-transform: uppercase; opacity: 0.8;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(22px) scale(0.96); }
      30% { opacity: 1; transform: translateY(0px) scale(1); }
      82% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-18px) scale(1.04); }
    }

    /* --- HEADER --- */
    #template-header {
      width: 100%; height: 78px;
      background: linear-gradient(180deg, #0d1c14 0%, #070f0a 100%);
      border-bottom: 1px solid var(--accent-glow);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      z-index: 1000; flex-shrink: 0;
    }
    .template-title {
      font-family: var(--font-display); font-weight: 700; font-size: 1.9rem;
      letter-spacing: 3px; text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 24px var(--accent-glow);
    }
    .template-subtitle {
      font-size: 0.68rem; color: var(--accent-gold); letter-spacing: 3px;
      text-transform: uppercase; margin-top: 4px; font-weight: 600; opacity: 0.85;
    }

    /* --- MAP --- */
    #map-section { width: 100%; flex-grow: 1; position: relative; background: #000; padding: 12px; }

    .map-container {
      width: 100%; height: 100%; border-radius: 10px; overflow: hidden; position: relative;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.75);
      border: 1px solid rgba(217, 178, 60, 0.25); background: #08120e;
    }

    #real-satellite-map { width: 100%; height: 100%; z-index: 1; }

    /* --- HUD --- */
    .hud-overlay {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: rgba(9, 18, 14, 0.85); backdrop-filter: blur(12px);
      border: 1px solid var(--accent-glow); padding: 10px 24px; border-radius: 30px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.7); pointer-events: none; z-index: 1000; white-space: nowrap;
    }
    .hud-text { font-size: 0.82rem; color: var(--text-main); letter-spacing: 0.5px; }
    .hud-text strong { color: var(--accent-gold-bright); }

    /* --- LEAFLET OVERRIDES --- */
    .leaflet-control-zoom a {
      background-color: rgba(9, 18, 14, 0.92) !important; color: var(--accent-gold) !important;
      border-color: rgba(217, 178, 60, 0.25) !important;
    }
    .leaflet-popup-content-wrapper {
      background: rgba(9, 18, 14, 0.96) !important; color: #fff !important;
      border: 1px solid var(--accent-gold); border-radius: 10px !important;
      box-shadow: 0 6px 22px rgba(0,0,0,0.75) !important;
    }
    .leaflet-popup-tip { background: rgba(9, 18, 14, 0.96) !important; }
  </style>
</head>
<body>

  <div id="cloud-intro">
    <div class="intro-content">
      <div class="intro-subtitle">Welcome To</div>
      <h1 class="intro-title">Hare Krishna<br>Nature Farm</h1>
    </div>
  </div>

  <header id="template-header">
    <div class="template-title">Hare Krishna Nature Farm</div>
    <div class="template-subtitle">Live Satellite Portal • Locked Sanctuary Perimeter</div>
  </header>

  <main id="map-section">
    <div class="map-container">
      <div id="real-satellite-map"></div>
      <div class="hud-overlay">
        <span class="hud-text">✨ <strong>Sanctuary Map:</strong> Click Any Location Marker to Smoothly Zoom In</span>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==========================================================================
    // 1. SANCTUARY LOCATIONS LIST (WITH UPDATED TEMPLE COORDINATE)
    // ==========================================================================
    const sanctuaryLocations = [
      { 
        name: "Krishna Balaram Temple", 
        lat: 12.398114,       // Updated from 12°23'53.21"N
        lon: 76.757853,       // Updated from 76°45'28.27"E
        description: "Sanctuary Center & Temple Complex", 
        isCenter: true 
      },
      { name: "Akshaya Patra Foundation", lat: 12.396878, lon: 76.760297, description: "Community Kitchen & Service Initiative", isCenter: false },
      { name: "Kaveri River", lat: 12.402789, lon: 76.758100, description: "Sacred Waters & Riverside Sanctuary", isCenter: false },
      { name: "Goshala", lat: 12.397269, lon: 76.757431, description: "Cow Protection & Dairy Sanctuary", isCenter: false }
    ];

    const farmBoundaryCoordinates = [
      [12.402578, 76.752256], [12.401856, 76.751600], [12.401294, 76.751453],
      [12.401236, 76.752019], [12.400550, 76.752319], [12.400881, 76.753078],
      [12.399453, 76.753817], [12.399375, 76.754164], [12.396069, 76.756006],
      [12.395019, 76.756042], [12.394922, 76.757878], [12.394508, 76.758061],
      [12.394672, 76.758903], [12.395489, 76.758942], [12.395856, 76.760583],
      [12.398022, 76.760436], [12.398219, 76.760208], [12.398961, 76.760814],
      [12.399917, 76.760825], [12.400269, 76.760572], [12.400672, 76.760844],
      [12.401369, 76.760403], [12.401853, 76.760408], [12.401436, 76.761311],
      [12.401561, 76.761572], [12.401175, 76.763236], [12.402489, 76.763308],
      [12.402636, 76.763100], [12.402767, 76.763075]
    ];

    const southWestCorner = L.latLng(12.390428, 76.749592);
    const northEastCorner = L.latLng(12.408306, 76.766311);
    const restrictedBounds = L.latLngBounds(southWestCorner, northEastCorner);

    const centerLat = sanctuaryLocations[0].lat;
    const centerLon = sanctuaryLocations[0].lon;

    const map = L.map('real-satellite-map', {
      center: [centerLat, centerLon],
      zoom: 13,
      minZoom: 14,
      maxZoom: 20,
      maxBounds: restrictedBounds,
      maxBoundsViscosity: 1.0,
      zoomControl: true,
      attributionControl: false
    });

    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    // Soft outer glow
    L.polygon(farmBoundaryCoordinates, {
      color: '#d9b23c', weight: 4, opacity: 0.22, fill: false
    }).addTo(map);

    // Crisp property line
    const propertyBoundary = L.polygon(farmBoundaryCoordinates, {
      color: '#d9b23c', weight: 1.8, opacity: 0.9, fillColor: '#d9b23c', fillOpacity: 0.07
    }).addTo(map);

    sanctuaryLocations.forEach(spot => {
      const markerColor = spot.isCenter ? "#f3dd8f" : "#ffffff";
      const markerRadius = spot.isCenter ? 5.5 : 4.0;

      const marker = L.circleMarker([spot.lat, spot.lon], {
        radius: markerRadius,
        fillColor: markerColor,
        color: "#d9b23c",
        weight: 1.2,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      const popupContent = `
        <div style="text-align: center; padding: 4px; font-family: 'Inter', sans-serif;">
          <strong style="color: #d9b23c; font-size: 14px; letter-spacing: 0.5px;">${spot.name}</strong><br>
          <span style="color: #ddd; font-size: 11px; display: block; margin: 4px 0;">${spot.description}</span>
          <span style="color: #9fdc9f; font-size: 10px; font-weight: bold; text-transform: uppercase;">↗ Click to Zoom Here</span>
        </div>
      `;

      marker.bindPopup(popupContent);

      marker.on('click', () => {
        map.flyTo([spot.lat, spot.lon], 18, {
          animate: true, duration: 1.6, easeLinearity: 0.25
        });
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const cloudIntro = document.getElementById('cloud-intro');
        cloudIntro.style.opacity = '0';
        cloudIntro.style.transform = 'scale(1.1)';
        cloudIntro.style.pointerEvents = 'none';

        map.flyToBounds(propertyBoundary.getBounds(), {
          padding: [30, 30], duration: 2.2, easeLinearity: 0.2
        });

        setTimeout(() => cloudIntro.remove(), 2200);
      }, 2300);
    });
  </script>

</body>
</html>
