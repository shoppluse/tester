<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hare Krishna Nature Farm | Live Satellite Portal</title>
  
  <!-- Leaflet Map Engine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ==========================================================================
       1. CORE TEMPLATE LAYOUT & THEME
       ========================================================================== */
    :root {
      --bg-dark: #050a08;
      --accent-gold: #ffd700;
      --accent-glow: rgba(255, 215, 0, 0.45);
      --text-main: #ffffff;
      --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      display: flex; 
      flex-direction: column; 
    }

    /* --- TOP HEADER BANNER --- */
    #template-header {
      width: 100%; 
      height: 75px;
      background: linear-gradient(180deg, #11221b 0%, #08120e 100%);
      border-bottom: 3px solid var(--accent-gold);
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.8);
      z-index: 1000; 
      flex-shrink: 0;
    }

    .template-title {
      font-size: 1.8rem; 
      font-weight: 800; 
      letter-spacing: 6px; 
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .template-subtitle {
      font-size: 0.75rem;
      color: var(--accent-gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 600;
    }

    /* --- RECTANGULAR MAP SECTION --- */
    #map-section {
      width: 100%; 
      flex-grow: 1; 
      position: relative; 
      background: #000;
      padding: 12px;
    }

    /* The Map Container Box */
    .map-container {
      width: 100%; 
      height: 100%; 
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 215, 0, 0.4);
      background: #08120e;
    }

    #real-satellite-map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* --- FLOATING HUD OVERLAY --- */
    .hud-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 16, 12, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.5);
      padding: 10px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .hud-text {
      font-size: 0.85rem;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .hud-text strong {
      color: var(--accent-gold);
    }

    /* Customizing Leaflet UI to match dark theme */
    .leaflet-control-zoom a {
      background-color: rgba(6, 16, 12, 0.9) !important;
      color: var(--accent-gold) !important;
      border-color: rgba(255, 215, 0, 0.4) !important;
    }
  </style>
</head>
<body>

  <!-- TOP TEMPLATE HEADER -->
  <header id="template-header">
    <div class="template-title">Hare Krishna Nature Farm</div>
    <div class="template-subtitle">Live Satellite Portal • Locked Sanctuary Perimeter</div>
  </header>

  <!-- MAIN RECTANGULAR MAP VIEWPORT -->
  <main id="map-section">
    <div class="map-container">
      
      <!-- Real Google Satellite Map Canvas -->
      <div id="real-satellite-map"></div>

      <!-- Floating Information Tag -->
      <div class="hud-overlay">
        <span class="hud-text">🔒 <strong>Map Locked:</strong> Mobile & Desktop Navigation Restricted to Sanctuary Perimeter</span>
      </div>

    </div>
  </main>

  <!-- Leaflet Map Engine JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ==========================================================================
    // 1. SANCTUARY LOCATIONS LIST
    // ==========================================================================
    const sanctuaryLocations = [
      { 
        name: "Krishna Balaram Temple", 
        lat: 12.398800, 
        lon: 76.757700, 
        description: "Sanctuary Center & Temple Complex",
        isCenter: true 
      },
      { 
        name: "Akshaya Patra Foundation", 
        lat: 12.396878, 
        lon: 76.760297, 
        description: "Community Kitchen & Service Initiative",
        isCenter: false 
      },
      { 
        name: "Kaveri River", 
        lat: 12.402789, 
        lon: 76.758100, 
        description: "Sacred Waters & Riverside Sanctuary",
        isCenter: false 
      },
      { 
        name: "Goshala", 
        lat: 12.397269, 
        lon: 76.757431, 
        description: "Cow Protection & Dairy Sanctuary",
        isCenter: false 
      }
    ];

    // ==========================================================================
    // 2. YOUR EXACT 29-POINT PROPERTY BOUNDARY (GOLDEN LINE)
    // ==========================================================================
    const farmBoundaryCoordinates = [
      [12.402578, 76.752256], [12.401856, 76.751600], [12.401294, 76.751453],
      [12.401236, 76.752019], [12.400550, 76.752319], [12.400881, 76.753078],
      [12.399453, 76.753817], [12.399375, 76.754164], [12.396069, 76.756006],
      [12.395019, 76.756042], [12.394922, 76.757878], [12.394508, 76.758061],
      [12.394672, 76.758903], [12.395489, 76.758942], [12.395856, 76.760583],
      [12.398022, 76.760436], [12.398219, 76.760208], [12.398961, 76.760814],
      [12.399917, 76.760825], [12.400269, 76.760572], [12.400672, 76.760844],
      [12.401369, 76.760403], [12.401853, 76.760408], [12.401436, 76.761311],
      [12.401561, 76.761572], [12.401175, 76.763236], [12.402489, 76.763308],
      [12.402636, 76.763100], [12.402767, 76.763075]
    ];

    // ==========================================================================
    // 3. MAP ACCESS LOCK (RESTRICTING VIEWPORT TO YOUR 4 BORDER COORDINATES)
    // ==========================================================================
    
    // Define the exact South-West (Bottom-Left) and North-East (Top-Right) corners
    const southWestCorner = L.latLng(12.390428, 76.749592); // From 12°23'25.54"N 76°44'59.99"E
    const northEastCorner = L.latLng(12.408306, 76.766311); // From 12°24'29.90"N 76°45'58.72"E
    const restrictedBounds = L.latLngBounds(southWestCorner, northEastCorner);

    const centerLat = sanctuaryLocations[0].lat;
    const centerLon = sanctuaryLocations[0].lon;

    // Initialize Map with SOLID WALL BOUNDS and ZOOM LIMITS
    const map = L.map('real-satellite-map', {
      center: [centerLat, centerLon],
      zoom: 15,
      minZoom: 14,                      // Prevents mobile users from pinching out too far
      maxZoom: 20,                      // Allows close-up inspection of trees & buildings
      maxBounds: restrictedBounds,      // Sets the invisible four-walled border
      maxBoundsViscosity: 1.0,          // 1.0 = Solid Wall! Camera refuses to drag outside!
      zoomControl: true,
      attributionControl: false
    });

    // Load Real Google Maps Satellite Imagery Direct Tile Servers
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    // Optional: Draw a subtle dashed frame around the extreme outer border so users see the edge
    L.rectangle(restrictedBounds, {
      color: "#ffd700",
      weight: 1.5,
      dashArray: '6, 6',
      fill: false,
      opacity: 0.4
    }).addTo(map);

    // ==========================================================================
    // 4. DRAW THE GOLDEN PROPERTY BOUNDARY
    // ==========================================================================
    L.polygon(farmBoundaryCoordinates, {
      color: '#ffd700',       
      weight: 8,              
      opacity: 0.35,          
      fill: false             
    }).addTo(map);

    const propertyBoundary = L.polygon(farmBoundaryCoordinates, {
      color: '#ffd700',       
      weight: 3.5,            
      opacity: 1.0,           
      fillColor: '#ffd700',   
      fillOpacity: 0.10       
    }).addTo(map);

    propertyBoundary.bindPopup("<b>Hare Krishna Nature Farm</b><br>Official Protected Sanctuary Perimeter");

    // ==========================================================================
    // 5. PLACE ALL SANCTUARY MARKERS ON THE MAP
    // ==========================================================================
    sanctuaryLocations.forEach(spot => {
      const markerColor = spot.isCenter ? "#ffd700" : "#ffffff";
      const markerRadius = spot.isCenter ? 9 : 7;

      const marker = L.circleMarker([spot.lat, spot.lon], {
        radius: markerRadius,
        fillColor: markerColor,
        color: "#ffd700",     
        weight: 2,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      const popupContent = `
        <div style="text-align: center; font-family: sans-serif;">
          <strong style="color: #08120e; font-size: 14px;">${spot.name}</strong><br>
          <span style="color: #555; font-size: 12px;">${spot.description}</span><br>
          <code style="font-size: 10px; color: #888;">${spot.lat.toFixed(4)}°, ${spot.lon.toFixed(4)}°</code>
        </div>
      `;
      
      marker.bindPopup(popupContent);

      if (spot.isCenter) {
        marker.openPopup();
      }
    });

    // Automatically zoom and center the screen to fit the golden boundary inside the locked walls
    map.fitBounds(propertyBoundary.getBounds(), { padding: [30, 30] });
  </script>

</body>
</html>
